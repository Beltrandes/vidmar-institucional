	<!-- Conversao de WhatsApp para links fora do React (ex.: botao flutuante whatsa.me).
	     Os links internos usam o componente WhatsAppLink, que ja dispara o evento;
	     por isso aqui nao ha preventDefault: o clique segue normalmente e o evento
	     e enviado em paralelo, sem quebrar target="_blank" no mobile. -->
	<script>
		document.addEventListener('click', function (e) {
			var anchor = e.target.closest && e.target.closest('a');
			if (!anchor || !anchor.href) return;
			if (anchor.dataset.waTracked === 'true') return;
			if (!/(whatsa\.me|wa\.me|whatsapp\.com)/.test(anchor.href)) return;

			if (typeof gtag === 'function') {
				gtag('event', 'ads_conversion_whatsapp', { 'event_timeout': 2000 });
			}
		});
	</script>
