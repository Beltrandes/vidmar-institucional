			};

				var anchor = e.target.closest('a');

					anchor.href.includes('whatsa.me') ||
					anchor.href.includes('wa.me') ||
					anchor.href.includes('whatsapp.com') ||
					anchor.href.includes('api.whatsapp.com')
				)) {
					e.preventDefault();
					gtagSendEvent(anchor.href);
				}
			});
		});
